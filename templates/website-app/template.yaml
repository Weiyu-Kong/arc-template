schema_version: "1.0"
id: website-app
name: Website Application
type: website_app
version: 1.0.0
description: Full-stack website application template for generation agents.
stack:
  frontend:
    framework: Vite
    library: React
    router: React Router
    language: TypeScript
    styling: TailwindCSS
  backend:
    framework: FastAPI
    language: Python
  tests:
    backend: pytest
    frontend: Vitest
    e2e: Playwright
copy:
  source: files
  exclude:
    - frontend/node_modules
    - frontend/dist
    - .venv
    - .pytest_cache
preview:
  html: frontend/dist/index.html
  fallback_html: frontend/preview.html
  assets: frontend/dist/assets
agent_guidance:
  ui_root: frontend/src
  api_root: backend/app/routes.py
  function_root: backend/app
  db_root: backend/app/repository.py
  backend_test_root: backend/tests
  frontend_test_root: frontend/src
  e2e_test_root: frontend/e2e
