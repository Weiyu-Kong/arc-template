schema_version: "1.0"
templates:
  - id: website-app
    name: Website Application
    type: website_app
    version: 1.0.0
    path: templates/website-app
    stack:
      - Vite
      - React
      - React Router
      - TypeScript
      - TailwindCSS
      - FastAPI
      - pytest
      - Vitest
      - Playwright
  - id: mobile-app
    name: Mobile Application
    type: mobile_app
    version: 1.0.0
    path: templates/mobile-app
    stack:
      - Android
      - Java
      - Gradle
      - JUnit
